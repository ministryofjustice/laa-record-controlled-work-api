server:
  port: 8081 # change to desired port number

spring:
  application:
    name: laa-record-controlled-work
    version: @version@

  autoconfigure:
    # we only use OAuth2AuthorizedClientManager programmatically for the datastore OBO exchange,
    # not Spring's default oauth2Login filter chain, which also breaks @WebMvcTest slices.
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration

  # example database
  datasource:
    url: jdbc:h2:mem:itemsDb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  #do not auto create db schema, use .sql scripts
  jpa:
    hibernate:
      ddl-auto: none

  security:
    oauth2:
      client:
        registration:
          datastore:
            client-id: ${RCW_API_CLIENT_ID:test-client}
            client-secret: ${RCW_API_CLIENT_SECRET:test-secret}
            authorization-grant-type: urn:ietf:params:oauth:grant-type:jwt-bearer
            scope: DataStore.Access
        provider:
          datastore:
            token-uri: ${DATASTORE_TOKEN_URI:http://localhost:9090/default/token}

management:
  server:
    port: 8181 # change to desired port number
  # specify actuator endpoints to enable
  endpoints:
    web:
      exposure:
        include: health

sentry:
  dsn: # configure dsn url here
  environment: # configure environment name here

# ECS structured logging
logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    org.springframework.security: ${SPRING_SECURITY_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2: ${SPRING_SECURITY_OAUTH2_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2.jwt: ${SPRING_SECURITY_OAUTH2_JWT_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2.server.resource: ${SPRING_SECURITY_OAUTH2_SERVER_RESOURCE_LOGGING_LEVEL:debug}
    org.springframework.boot.actuate: warn
    uk.gov.laa.springboot.oauth2: ${LAA_SPRINGBOOT_OAUTH2_LOGGING_LEVEL:debug}
    uk.gov.justice.laa.springboot.microservice: ${APP_LOGGING_LEVEL:info}
    uk.gov.justice.laa.rcw: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:default}
        version: ${spring.application.version:default}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}

laa:
  datastore:
    client:
      base-url: ${DATASTORE_URL:http://localhost:8080}
      client-registration-id: datastore

  springboot.starter:
    oauth2:
      scopes-claim-path: scp
      resourceserver:
        jwt:
          tenants:
            - issuer-uri: ${ISSUER}
              audiences:
                - ${AUDIENCE}
      authorized-scopes: '[
          {
            "name": "Applications.Read",
            "uris": [
              {"method":["GET","POST","PUT","PATCH","DELETE"],"uri":"/api/v1/**"}
            ]
          }
        ]'
      unprotected-uris: [ "/actuator/**", "/swagger-ui.html",
                          "/swagger-ui/**", "/v3/api-docs/**", "/favicon.ico",
                          "/open-api-specification.yml" ]


---
# non-local environments use ECS JSON logs
spring:
  config:
    activate:
      on-profile: dev,uat,staging,prod

logging:
  structured:
    format:
      console: ecs

---
# local profile configuration
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    org.springframework.security: ${SPRING_SECURITY_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2: ${SPRING_SECURITY_OAUTH2_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2.jwt: ${SPRING_SECURITY_OAUTH2_JWT_LOGGING_LEVEL:debug}
    org.springframework.security.oauth2.server.resource: ${SPRING_SECURITY_OAUTH2_SERVER_RESOURCE_LOGGING_LEVEL:debug}
    uk.gov.laa.springboot.oauth2: ${LAA_SPRINGBOOT_OAUTH2_LOGGING_LEVEL:debug}
    uk.gov.justice.laa.springboot.microservice: ${APP_LOGGING_LEVEL:info}
    uk.gov.justice.laa.rcw: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: # disables structured logging locally
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr{faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

laa:
  springboot.starter:
    oauth2:
      scopes-claim-path: scp
      resourceserver:
        jwt:
          tenants:
            - issuer-uri: ${ISSUER:http://localhost:9090/default}
              audiences:
                - ${AUDIENCE:default}