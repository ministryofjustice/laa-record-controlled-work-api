plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
    //    id 'io.sentry.jvm.gradle' version '6.5.0'
    id 'com.diffplug.spotless' version "8.10.2"
    id 'au.com.dius.pact' version '4.7.5'
}

repositories {
    maven {
        url = "https://maven.pkg.github.com/ministryofjustice/laa-info-and-advice-datastore"
        credentials {
            // needs username as well, must be set using GITHUB_ACTOR
            password = project.ext.gitHubPackagesPassword
        }
    }
}

// Replaces application.yml @version@  with version from gradle.properties
processResources {
    filesMatching('application.yml') {
        filter {
            it.replace('@version@', version)
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// --- Pact consumer contract: dedicated source set, calls the real generated datastore client
// directly against a Pact MockServer (bypassing the app's Spring context / OBO token exchange,
// which is this app's own concern, not part of the HTTP wire contract being verified here). ---
sourceSets {
    pactTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += compileClasspath
    }
}

configurations {
    pactTestImplementation.extendsFrom implementation, testImplementation
    pactTestRuntimeOnly.extendsFrom   runtimeOnly, testRuntimeOnly
}

// Generates pacts into build/pacts on every run; publishing is a separate `pactPublish` task
// (see the `pact { publish { ... } }` block below), invoked only in CI on merge to main.
tasks.register('pactTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath       = sourceSets.pactTest.runtimeClasspath
    doFirst { delete fileTree("${buildDir}/pacts") }
}

// Publish config: everything from env; local runs are a no-op when unset, CI publishes on main.
pact {
    publish {
        pactBrokerUrl      = System.getenv('PACT_BROKER_URL')
        pactBrokerUsername = System.getenv('PACT_BROKER_USERNAME')
        pactBrokerPassword = System.getenv('PACT_BROKER_PASSWORD')
        consumerVersion    = System.getenv('GIT_SHA') ?: project.version
        consumerBranch     = System.getenv('GIT_BRANCH') ?: 'main'
        tags               = [System.getenv('GIT_BRANCH') ?: 'main']
    }
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

dependencies {
    implementation project(':record-controlled-work-api')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-oauth2'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'

    implementation 'uk.gov.justice.laa.ia.datastore:info-and-advice-datastore-client:0.12.0'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    pactTestImplementation 'au.com.dius.pact.consumer:junit5:4.7.5'
}

spotless {
    java {
        // When -PspotlessFiles is supplied (comma-separated paths, e.g. from the pre-commit
        // hook), scope formatting to just those files instead of the whole source set.
        if (project.hasProperty('spotlessFiles')) {
            target project.property('spotlessFiles').split(',').collect { rootProject.file(it) }
        } else {
            target 'src/*/java/**/*.java'
        }
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
    }
}

tasks.register('checkstyleAll') {
    group = 'verification'
    description = 'Runs checkstyleMain, checkstyleTest, checkstyleIntegrationTest, and checkstylePactTest.'
    dependsOn tasks.matching { it.name in ['checkstyleMain', 'checkstyleTest', 'checkstyleIntegrationTest', 'checkstylePactTest'] }
}

// When -PcheckstyleFiles is supplied (comma-separated paths, e.g. from the pre-commit hook),
// scope Checkstyle to just those files instead of the whole source set.
if (project.hasProperty('checkstyleFiles')) {
    def targetPaths = project.property('checkstyleFiles').split(',').collect { rootProject.file(it).canonicalPath } as Set
    tasks.withType(org.gradle.api.plugins.quality.Checkstyle).configureEach {
        source = source.filter { targetPaths.contains(it.canonicalPath) }
        onlyIf { !source.empty }
    }
}
