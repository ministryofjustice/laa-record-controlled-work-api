plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
    //    id 'io.sentry.jvm.gradle' version '6.5.0'
    id 'com.diffplug.spotless' version "8.9.0"
}

apply from: "$rootDir/record-controlled-work-service/dependency-overrides.gradle"

repositories {
    maven {
        url = "https://maven.pkg.github.com/ministryofjustice/laa-info-and-advice-datastore"
        credentials {
            // needs username as well, must be set using GITHUB_ACTOR
            password = project.ext.gitHubPackagesPassword
        }
    }
}

// Replaces application.yml @version@  with version from gradle.properties
processResources {
    filesMatching('application.yml') {
        filter {
            it.replace('@version@', version)
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/SpringBootMicroserviceApplication.class'])
        }))
    }
}

dependencies {
    implementation project(':record-controlled-work-api')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-oauth2'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'

    implementation 'uk.gov.justice.laa.ia.datastore:info-and-advice-datastore-client:0.2.1'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

spotless {
    java {
        // When -PspotlessFiles is supplied (comma-separated paths, e.g. from the pre-commit
        // hook), scope formatting to just those files instead of the whole source set.
        if (project.hasProperty('spotlessFiles')) {
            target project.property('spotlessFiles').split(',').collect { rootProject.file(it) }
        } else {
            target 'src/*/java/**/*.java'
        }
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat()
    }
}

tasks.register('checkstyleAll') {
    group = 'verification'
    description = 'Runs checkstyleMain, checkstyleTest, and checkstyleIntegrationTest.'
    dependsOn tasks.matching { it.name in ['checkstyleMain', 'checkstyleTest', 'checkstyleIntegrationTest'] }
}

// When -PcheckstyleFiles is supplied (comma-separated paths, e.g. from the pre-commit hook),
// scope Checkstyle to just those files instead of the whole source set.
if (project.hasProperty('checkstyleFiles')) {
    def targetPaths = project.property('checkstyleFiles').split(',').collect { rootProject.file(it).canonicalPath } as Set
    tasks.withType(org.gradle.api.plugins.quality.Checkstyle).configureEach {
        source = source.filter { targetPaths.contains(it.canonicalPath) }
        onlyIf { !source.empty }
    }
}
