openapi: "3.0.0"
info:
  version: 1.0.0
  title: Record Controlled Work API
paths:
  /api/v1/applications:
    get:
      tags:
        - applications
      summary: Get all applications
      operationId: getApplications
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 25
        - name: officeId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApplicationState"
        - name: eligibilityIndication
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EligibilityIndication"
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applications"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - applications
      summary: Create an application
      operationId: createApplication
      requestBody:
        description: create an application
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequestBody'
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponseBody'
          headers:
            Location:
              description: Canonical RCW application URL for the created application
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/applications/{id}:
    get:
      tags:
        - applications
      summary: Get application by ID
      operationId: getApplication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          headers:
            ETag:
              description: Strong application version validator, quoted as an integer
              schema:
                type: string
                pattern: '^"[0-9]+"$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/applications/{id}/details:
    put:
      tags:
        - applications
      summary: Update an application's client and case details
      description: >
        Replaces the complete editable details snapshot. The If-Match value
        must be a strong quoted integer validator returned by GET. A missing
        If-Match returns 428; a malformed, weak, or wildcard value returns
        400; a stale version returns 412 with reason
        APPLICATION_VERSION_CONFLICT. A completed application returns 409
        with reason APPLICATION_COMPLETED; an unclassified downstream 409
        remains 409. For the applicable priorLegalAid
        branch, legalAidLast6Months true requires a nonblank
        reasonForReapplication. When legalAidLast6Months is false, or another
        priorLegalAid branch applies, reasonForReapplication must be null.
        hasFixedAddress true requires an address object; false requires
        address null. Explicit null clears nullable values; omitted properties
        are invalid. Empty strings remain values and are not clear operations.
        Request bodies are limited to 65,536 bytes by default; oversized
        bodies return 413.
      operationId: updateApplicationDetails
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          description: >
            Strong quoted integer validator from GET. If omitted, the server
            returns 428 Precondition Required.
          schema:
            type: string
            pattern: '^"[0-9]+"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationDetailsRequestBody"
      responses:
        '204':
          description: Application details updated successfully
          headers:
            ETag:
              description: New strong application version validator, quoted as an integer
              schema:
                type: string
                pattern: '^"[0-9]+"$'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/applications/{id}/evidence:
    put:
      tags:
        - applications
      summary: Update the evidence data for an application
      operationId: updateApplicationEvidence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEvidenceRequestBody"
      responses:
        '204':
          description: 'Application evidence data updated successfully'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/applications/{id}/means:
    put:
      tags:
        - applications
      summary: Update the means data for an application
      operationId: updateApplicationMeans
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeansDataRequestBody"
      responses:
        '204':
          description: 'Application means data updated successfully'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/applications/{id}/declaration:
    put:
      tags:
        - applications
      summary: Update the signed declaration for an application
      operationId: updateApplicationDeclaration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeclarationRequestBody"
      responses:
        '204':
          description: 'Application declaration updated successfully'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/applications/{id}/status:
    patch:
      tags:
        - applications
      summary: Update the application status
      operationId: updateApplicationStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationStatusRequestBody"
      responses:
        '204':
          description: 'Application status updated successfully'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ApplicationOverview:
      required:
        - id
        - name
        - applicationRefNumber
        - modifiedAt
        - eligibilityIndication
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        applicationRefNumber:
          type: string
        modifiedAt:
          type: string
          format: date-time
        eligibilityIndication:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EligibilityIndication"

    CreateApplicationRequestBody:
      type: object
      additionalProperties: false
      required:
        - providerOfficeCode
        - scopingQuestions
        - clientDetails
      properties:
        legalAidBefore:
          $ref: "#/components/schemas/PriorLegalAid"
        legalAidLast6Months:
          type: boolean
        reasonForReapplication:
          type: string
        providerOfficeCode:
          type: string
        scopingQuestions:
          $ref: '#/components/schemas/ScopingQuestions'
        clientDetails:
          $ref: "#/components/schemas/CreateClientDetailsRequestBody"
      allOf:
        - $ref: "./open-api-specifications/validation/CreateApplication/PriorLegalAid.yml#/components/schemas/PriorLegalAidRule"
        - $ref: "./open-api-specifications/validation/CreateApplication/PriorLegalAid.yml#/components/schemas/RecentLegalAidRule"
      not:
        $ref: "./open-api-specifications/validation/CreateApplication/PriorLegalAid.yml#/components/schemas/SameMatterMissingRecentAidRule"

    ScopingQuestions:
      type: object
      additionalProperties: false
      required:
        - priorLegalAid
      properties:
        priorLegalAid:
          $ref: "#/components/schemas/PriorLegalAid"
        familyLawClassification:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/familyLawClassification"

    ApplicationScopingQuestions:
      type: object
      additionalProperties: false
      properties:
        priorLegalAid:
          $ref: "#/components/schemas/PriorLegalAid"
        familyLawClassification:
          $ref: "#/components/schemas/familyLawClassification"

    CreateClientDetailsRequestBody:
      additionalProperties: false
      required:
        - firstName
        - lastName
        - dateOfBirth
        - hasFixedAddress
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
          x-rcw-date:
            exclusiveMinimum: "1900-01-01"
            inclusiveToday: true
            timezone: Europe/London
        niNumber:
          type: string
          description: Formatting characters are removed and letters uppercased before validation.
          minLength: 9
          maxLength: 9
          pattern: '^(?!BG|GB|KN|NK|NT|TN|ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z][0-9]{6}[ABCD]$'
        hasFixedAddress:
          type: boolean
        address:
          $ref: "#/components/schemas/CreateAddressRequestBody"
      allOf:
        - $ref: "./open-api-specifications/validation/CreateApplication/Address.yml#/components/schemas/ClientDetailsAddressRule"

    CreateAddressRequestBody:
      additionalProperties: false
      required:
        - addressLine1
        - country
      type: object
      properties:
        addressLine1:
          type: string
          minLength: 1
        addressLine2:
          type: string
        addressLine3:
          type: string
        addressLine4:
          type: string
        townOrCity:
          type: string
        postCode:
          type: string
          description: For UK addresses, formatting characters are removed and letters uppercased before validation.
        county:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^(?:A(?:D|E|F|G|L|M|O|R|T|U|Z)|B(?:A|B|D|E|F|G|H|I|J|N|O|R|S|T|W|Y|Z)|C(?:A|D|F|G|H|I|L|M|N|O|R|U|V|Y|Z)|D(?:E|J|K|M|O|Z)|E(?:C|E|G|R|S|T)|F(?:I|J|M|R)|G(?:A|B|D|E|H|M|N|Q|R|T|W|Y)|H(?:N|R|T|U)|I(?:D|E|L|N|Q|R|S|T)|J(?:M|O|P)|K(?:E|G|H|I|M|N|P|R|W|Z)|L(?:A|B|C|I|K|R|S|T|U|V|Y)|M(?:A|C|D|E|G|H|K|L|M|N|R|T|U|V|W|X|Y|Z)|N(?:A|E|G|I|L|O|P|R|Z)|O(?:M)|P(?:A|E|G|H|K|L|S|T|W|Y)|Q(?:A)|R(?:O|S|U|W)|S(?:A|B|C|D|E|G|I|K|L|M|N|O|R|S|T|V|Y|Z)|T(?:D|G|H|J|L|M|N|O|R|T|V|Z)|U(?:A|G|S|Y|Z)|V(?:A|C|E|N|U)|W(?:S)|X(?:K)|Y(?:E)|Z(?:A|M|W))$'
      allOf:
        - $ref: "./open-api-specifications/validation/CreateApplication/Address.yml#/components/schemas/AddressLineOneNonblankRule"
        - $ref: "./open-api-specifications/validation/CreateApplication/Address.yml#/components/schemas/AddressCountryRule"

    UpdateApplicationDetailsRequestBody:
      type: object
      additionalProperties: false
      required:
        - priorLegalAid
        - legalAidLast6Months
        - reasonForReapplication
        - ecfFlag
        - clientDetails
      properties:
        priorLegalAid:
          $ref: "#/components/schemas/PriorLegalAid"
        legalAidLast6Months:
          type: boolean
          description: Journey answer; not persisted as a separate field.
        reasonForReapplication:
          type: string
          nullable: true
          description: >
            Required but nullable. Must be nonblank when legalAidLast6Months
            is true on the applicable priorLegalAid branch; otherwise it must
            be null. An empty string is a value, not a clear operation.
        ecfFlag:
          type: boolean
        clientDetails:
          $ref: "#/components/schemas/UpdateClientDetailsRequestBody"

    UpdateClientDetailsRequestBody:
      type: object
      additionalProperties: false
      required:
        - firstName
        - lastName
        - dateOfBirth
        - niNumber
        - hasFixedAddress
        - address
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        niNumber:
          type: string
          description: Required but nullable; formatting characters are removed and letters uppercased before validation. Null clears the NI number.
          minLength: 9
          maxLength: 9
          pattern: '^(?!BG|GB|KN|NK|NT|TN|ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z][0-9]{6}[ABCD]$'
          nullable: true
        hasFixedAddress:
          type: boolean
          description: False requires address to be null.
        address:
          nullable: true
          description: Required but nullable; true hasFixedAddress requires an object.
          allOf:
            - $ref: "#/components/schemas/UpdateAddressRequestBody"

    UpdateAddressRequestBody:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - addressLine1
        - addressLine2
        - addressLine3
        - addressLine4
        - townOrCity
        - postCode
        - county
        - country
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        addressLine3:
          type: string
          nullable: true
        addressLine4:
          type: string
          nullable: true
        townOrCity:
          type: string
          nullable: true
        postCode:
          type: string
          nullable: true
          description: For UK addresses, formatting characters are removed and letters uppercased before validation.
        county:
          type: string
          nullable: true
        country:
          type: string
          minLength: 2
          maxLength: 2

    CreateApplicationResponseBody:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid

    Applications:
      type: array
      items:
        $ref: "#/components/schemas/ApplicationOverview"

    Application:
      type: object
      required:
        - id
        - individualLegalAidNumber
        - providerFirmCode
        - providerOfficeCode
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
        - clientDetails
        - applicationState
        - declaration
        - evidence
        - eligibility
        - scopingQuestions
        - applicationType
        - ecfFlag
      properties:
        id:
          type: string
          format: uuid
        applicationRefNumber:
          type: string
          nullable: true
        ufn:
          type: string
          nullable: true
        individualLegalAidNumber:
          type: string
          format: uuid
        providerFirmCode:
          type: string
        providerOfficeCode:
          type: string
        meansAssessmentId:
          type: string
          format: uuid
          nullable: true
        clientDetails:
          $ref: "#/components/schemas/ClientDetails"
        applicationState:
          $ref: "#/components/schemas/ApplicationState"
        declaration:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Declaration"
        evidence:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Evidence"
        eligibility:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Eligibility"
        reasonForReapplication:
          type: string
          nullable: true
        ecfFlag:
          type: boolean
          nullable: true
        meansAssessmentRequired:
          type: boolean
          nullable: true
        typeOfNonMeans:
          type: boolean
          nullable: true
        contribution:
          type: string
          nullable: true
        scopingQuestions:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApplicationScopingQuestions'
        applicationType:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedAt:
          type: string
          format: date-time
        modifiedBy:
          type: string

    UpdateEvidenceRequestBody:
      type: object
      properties:
        evidenceExemptionCode:
          type: string
        evidenceExemptionReason:
          type: string
        incomeEvidenceChecklist:
          type: object
        expenditureCapitalEvidenceChecklist:
          type: object

    UpdateMeansDataRequestBody:
      type: object
      required:
        - data
        - result
      properties:
        data:
          $ref: './open-api-specifications/components/eligibility-data-schema.yml#/components/schemas/EligibilityData'
        result:
          type: object

    UpdateApplicationStatusRequestBody:
      type: object
      required:
        - applicationState
        - eTag
      properties:
        applicationState:
          $ref: "#/components/schemas/ApplicationState"
        eTag:
          type: integer
          format: int64
          description: ETag value for optimistic concurrency control

    UpdateDeclarationRequestBody:
      type: object
      required:
        - declarationConfirmation
        - dateSigned
      properties:
        declarationConfirmation:
          type: boolean
        dateSigned:
          type: string
          format: date

    Eligibility:
      required:
        - result
        - data
      type: object
      properties:
        data:
          nullable: true
          allOf:
            - $ref: './open-api-specifications/components/eligibility-data-schema.yml#/components/schemas/EligibilityData'
        result:
          type: object
          nullable: true

    Declaration:
      required:
        - id
        - declarationConfirmation
        - createdAt
        - createdBy
        - modifiedAt
        - modifiedBy
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        declarationConfirmation:
          type: boolean
          nullable: true
        dateSigned:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true
        modifiedBy:
          type: string
          nullable: true

    Evidence:
      required:
        - evidenceExemptionCode
        - evidenceExemptionReason
        - incomeEvidenceChecklist
        - expenditureCapitalEvidenceChecklist
      type: object
      properties:
        evidenceExemptionCode:
          type: string
          nullable: true
        evidenceExemptionReason:
          type: string
          nullable: true
        incomeEvidenceChecklist:
          type: object
          nullable: true
        expenditureCapitalEvidenceChecklist:
          type: object
          nullable: true

    ClientDetails:
      required:
        - id
        - firstName
        - lastName
        - dateOfBirth
        - hasFixedAddress
        - createdAt
        - modifiedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        niNumber:
          type: string
          minLength: 9
          maxLength: 9
          pattern: '^(?!BG|GB|KN|NK|NT|TN|ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z][0-9]{6}[ABCD]$'
          nullable: true
        hasFixedAddress:
          type: boolean
        address:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Address"
        createdAt:
          type: string
          format: date-time
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true

    Address:
      required:
        - id
        - addressLine1
        - country
        - createdAt
        - modifiedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        addressLine3:
          type: string
          nullable: true
        addressLine4:
          type: string
          nullable: true
        townOrCity:
          type: string
          nullable: true
        postCode:
          type: string
          nullable: true
        county:
          type: string
          nullable: true
        country:
          type: string
          maxLength: 2
        createdAt:
          type: string
          format: date-time
          nullable: true
        modifiedAt:
          type: string
          format: date-time
          nullable: true

    ApplicationState:
      type: string
      enum:
        - DRAFT
        - COMPLETED

    EligibilityIndication:
      type: string
      enum:
        - eligible
        - ineligible

    PriorLegalAid:
      type: string
      enum:
        - 'no'
        - yesDifferentMatter
        - yesSameMatter

    familyLawClassification:
      type: string
      enum:
        - public
        - private

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type
          example: "about:blank"
        title:
          type: string
          description: Human-readable summary of the problem type
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          nullable: true
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence
          nullable: true
        reason:
          type: string
          description: Machine-readable code identifying the exact violation, e.g. APPLICATION_NOT_FOUND
          example: "APPLICATION_NOT_FOUND"
          nullable: true

    BadRequestResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"

    UnauthorizedResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"

    ForbiddenResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"

    NotFoundResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"

    ConflictResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"

    PreconditionFailedResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"

    PreconditionRequiredResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"

