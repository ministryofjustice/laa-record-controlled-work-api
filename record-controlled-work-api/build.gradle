import org.yaml.snakeyaml.DumperOptions
import org.yaml.snakeyaml.LoaderOptions
import org.yaml.snakeyaml.Yaml
import org.yaml.snakeyaml.constructor.SafeConstructor

plugins {
    id 'org.openapi.generator' version '7.25.0'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation gradleTestKit()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'rcw.api.repository.root', rootProject.projectDir.absolutePath
}

sourceSets.main.java.srcDirs += ['generated/src/main/java']

checkstyleMain.exclude "*"

def applicationSpecification = file("$rootDir/record-controlled-work-api/open-api-specification.yml")
def externalOpenApiSpecifications = file("$rootDir/record-controlled-work-api/open-api-specifications")
def dtoGenerationDirectory = layout.buildDirectory.dir('openapi')
def dtoGenerationSpecification = dtoGenerationDirectory.map { it.file('open-api-specification.yml') }
def contractDatePolicySpecification = providers.gradleProperty('contractDatePolicySpecification')
    .map { file(it) }
    .orElse(applicationSpecification)
def contractDatePolicySource = layout.buildDirectory.file(
    'generated/sources/contract-date-policy/main/java/uk/gov/justice/laa/rcw/validation/CreateApplicationDatePolicy.java')

sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/sources/contract-date-policy/main/java'))

// Generate DTOs from a derived spec; runtime validation always uses the source specification.
tasks.register('prepareDtoGenerationSpecification') {
    inputs.file(applicationSpecification)
    inputs.dir(externalOpenApiSpecifications)
    outputs.dir(dtoGenerationDirectory)

    doLast {
        def specification
        applicationSpecification.withReader('UTF-8') { reader ->
            specification = new Yaml(new SafeConstructor(new LoaderOptions())).load(reader)
        }
        // OpenAPI Generator turns composed request schemas into synthetic models and drops DTO fields.
        // Keep composition in the source spec; NetworkNT validates it before request binding.
        ['CreateApplicationRequestBody', 'CreateClientDetailsRequestBody', 'CreateAddressRequestBody'].each { name ->
            def schema = specification.components.schemas[name]
            schema.remove('allOf')
            schema.remove('not')
            schema.remove('oneOf')
        }
        def output = dtoGenerationSpecification.get().asFile
        output.parentFile.mkdirs()
        def options = new DumperOptions()
        options.defaultFlowStyle = DumperOptions.FlowStyle.BLOCK
        output.withWriter('UTF-8') { writer -> new Yaml(options).dump(specification, writer) }
        // Keep relative external references valid from the derived spec's directory.
        copy {
            from externalOpenApiSpecifications
            into new File(output.parentFile, 'open-api-specifications')
        }
    }
}

tasks.register('generateContractDatePolicy') {
    inputs.file(contractDatePolicySpecification)
    outputs.file(contractDatePolicySource)

    doLast {
        def specification
        contractDatePolicySpecification.get().withReader('UTF-8') { reader ->
            specification = new Yaml(new SafeConstructor(new LoaderOptions())).load(reader)
        }

        def dateOfBirth = specification?.components?.schemas?.CreateClientDetailsRequestBody
                ?.properties?.dateOfBirth
        def metadata = dateOfBirth instanceof Map ? dateOfBirth.get('x-rcw-date') : null
        def invalidMetadata = { String detail ->
            throw new GradleException(
                    "Invalid x-rcw-date metadata for CreateClientDetailsRequestBody.dateOfBirth: ${detail}")
        }
        if (!(metadata instanceof Map)) {
            invalidMetadata('metadata is required')
        }

        def expectedKeys = ['exclusiveMinimum', 'inclusiveToday', 'timezone'] as Set
        def actualKeys = metadata.keySet().collect { it.toString() } as Set
        if (actualKeys != expectedKeys) {
            invalidMetadata('expected exclusiveMinimum, inclusiveToday, and timezone')
        }

        def exclusiveMinimum = metadata.get('exclusiveMinimum')
        def timezone = metadata.get('timezone')
        if (!(exclusiveMinimum instanceof String)) {
            invalidMetadata('exclusiveMinimum must be an ISO calendar date string')
        }
        try {
            java.time.LocalDate.parse(exclusiveMinimum)
        } catch (java.time.DateTimeException exception) {
            invalidMetadata('exclusiveMinimum must be an ISO calendar date string')
        }
        if (metadata.get('inclusiveToday') != Boolean.TRUE) {
            invalidMetadata('inclusiveToday must be true')
        }
        if (!(timezone instanceof String) || !timezone.matches('[A-Za-z0-9_+./:-]+')) {
            invalidMetadata('timezone must be a supported zone identifier')
        }
        try {
            java.time.ZoneId.of(timezone)
        } catch (java.time.DateTimeException exception) {
            invalidMetadata('timezone must be a supported zone identifier')
        }

        def output = contractDatePolicySource.get().asFile
        output.parentFile.mkdirs()
        output.setText("""package uk.gov.justice.laa.rcw.validation;

import java.time.Clock;
import java.time.DateTimeException;
import java.time.LocalDate;
import java.time.ZoneId;

/** Enforces the generated create-request date policy. */
public final class CreateApplicationDatePolicy {

  private static final LocalDate EXCLUSIVE_MINIMUM = LocalDate.parse(\"${exclusiveMinimum}\");
  private static final ZoneId TIMEZONE = ZoneId.of(\"${timezone}\");

  private CreateApplicationDatePolicy() {}

  /** Checks a date against the request policy and the current date in its declared timezone. */
  public static boolean isValid(String value, Clock clock) {
    if (value == null) {
      return false;
    }
    try {
      LocalDate date = LocalDate.parse(value);
      LocalDate today = LocalDate.now(clock.withZone(TIMEZONE));
      return date.isAfter(EXCLUSIVE_MINIMUM) && !date.isAfter(today);
    } catch (DateTimeException exception) {
      return false;
    }
  }
}
""", 'UTF-8')
    }
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = dtoGenerationSpecification.get().asFile.toString()
    outputDir = "$rootDir/record-controlled-work-api/generated".toString()
    cleanupOutput = true
    apiPackage = "uk.gov.justice.laa.rcw.api"
    invokerPackage = "uk.gov.justice.laa.rcw.invoker"
    modelPackage = "uk.gov.justice.laa.rcw.model"
    configOptions = [
            generateBuilders    : "true",
            interfaceOnly       : "true", // This will only generate interfaces, not implementations
            // `nullable: true` is declared in open api spec so that orval in RCW UI can generate correct zod schemas
            //  without openApiNullable: false, the generator creates JsonNullable<T> fields that the mappers cannot handle
            openApiNullable     : "false",
            serializableModel   : "true",
            skipDefaultInterface: "true",
            useJakartaEe        : "true",
            useSpringBoot3      : "true",
            useTags             : "true",
    ]
}

tasks.named('openApiGenerate') {
    dependsOn tasks.named('prepareDtoGenerationSpecification')
}

compileJava.dependsOn 'openApiGenerate', 'generateContractDatePolicy'

clean {
    delete "$rootDir/record-controlled-work-api/generated"
}

// disable for overall project when running a build
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}