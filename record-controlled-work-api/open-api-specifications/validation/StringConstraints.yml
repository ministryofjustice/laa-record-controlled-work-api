components:
  schemas:
    WhitespaceOnlyString:
      type: string
      description: String containing only whitespace characters; U+FEFF is treated as whitespace.
      pattern: '^[\t\n\x0B\f\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]*$'

    NonblankString:
      type: string
      description: String containing at least one non-whitespace character; U+FEFF is treated as whitespace.
      pattern: '[^\t\n\x0B\f\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]'

    UkPostcodeString:
      type: string
      description: Normalized UK postcode without formatting characters, matching the supported postcode format.
      pattern: '^(?:GIR0AA|[A-Z]{1,2}[0-9][A-Z0-9]?[0-9][A-Z]{2})$'

    StrongApplicationVersion:
      type: string
      description: Strong application version validator, quoted as an integer.
      pattern: '^"[0-9]+"$'

    NationalInsuranceNumberFormat:
      type: string
      description: Matches the UK National Insurance number format after formatting characters are removed and letters are uppercased.
      pattern: '^(?!BG|GB|KN|NK|NT|TN|ZZ)[A-CEGHJ-PR-TW-Z][A-CEGHJ-NPR-TW-Z][0-9]{6}[ABCD]$'
