components:
  schemas:
    PriorLegalAidRule:
      oneOf:
        - $ref: "#/components/schemas/NoOrDifferentMatterBranch"
        - $ref: "#/components/schemas/YesSameMatterBranch"

    NoOrDifferentMatterBranch:
      properties:
        scopingQuestions:
          properties:
            priorLegalAid:
              enum:
                - 'no'
                - yesDifferentMatter

    YesSameMatterBranch:
      properties:
        scopingQuestions:
          properties:
            priorLegalAid:
              enum:
                - yesSameMatter

    RecentLegalAidRule:
      oneOf:
        - $ref: "#/components/schemas/NoLegalAidInLastSixMonthsBranch"
        - $ref: "#/components/schemas/YesLegalAidInLastSixMonthsBranch"

    NoLegalAidInLastSixMonthsBranch:
      properties:
        legalAidLast6Months:
          enum:
            - false
        reasonForReapplication:
          type: string
          maxLength: 0

    YesLegalAidInLastSixMonthsBranch:
      allOf:
        - $ref: "#/components/schemas/YesSameMatterBranch"
        - properties:
            legalAidLast6Months:
              enum:
                - true
            reasonForReapplication:
              $ref: "../StringConstraints.yml#/components/schemas/NonblankString"
          required:
            - legalAidLast6Months
            - reasonForReapplication

    SameMatterMissingRecentAidRule:
      allOf:
        - $ref: "#/components/schemas/YesSameMatterBranch"
        - not:
            required:
              - legalAidLast6Months