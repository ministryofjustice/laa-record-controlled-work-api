components:
  schemas:
    ClientDetailsAddressRule:
      oneOf:
        - $ref: "#/components/schemas/ClientDetailsWithFixedAddressBranch"
        - $ref: "#/components/schemas/ClientDetailsWithoutFixedAddressBranch"

    ClientDetailsWithFixedAddressBranch:
      properties:
        hasFixedAddress:
          enum:
            - true
      required:
        - address

    ClientDetailsWithoutFixedAddressBranch:
      properties:
        hasFixedAddress:
          enum:
            - false
      not:
        required:
          - address

    AddressLineOneNonblankRule:
      not:
        properties:
          addressLine1:
            pattern: '^[\t\n\x0B\f\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]*$'

    AddressCountryRule:
      oneOf:
        - $ref: "#/components/schemas/UkAddressBranch"
        - $ref: "#/components/schemas/NonUkAddressBranch"

    UkAddressBranch:
      properties:
        country:
          enum:
            - GB
        townOrCity:
          pattern: '[^\t\n\x0B\f\r \u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]'
        postCode:
          pattern: '^(?:GIR0AA|[A-Z]{1,2}[0-9][A-Z0-9]?[0-9][A-Z]{2})$'
      required:
        - townOrCity
        - postCode

    NonUkAddressBranch:
      not:
        properties:
          country:
            enum:
              - GB