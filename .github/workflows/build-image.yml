name: Build image

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to build
        required: true
        type: string
      push-latest:
        description: Also publish the GHCR `latest` tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GHCR_IMAGE: ghcr.io/ministryofjustice/laa-record-controlled-work-api

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: ECR auth
        id: ecr
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/ecr-auth@583a60502327d7b9b7701fdb11be9f7d096cf9f5 # main
        with:
          ecr_region: ${{ vars.ECR_REGION }}
          ecr_role: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          role-session-name: github-cicd-build-image-${{ github.run_number }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # A re-run, or a main push of a SHA already built on a branch, reuses the image.
      - name: Check for an existing image
        id: existing
        run: |
          image="${{ steps.ecr.outputs.image_registry }}/${{ vars.ECR_REPOSITORY }}:${{ inputs.sha }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image $image"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.image_registry }}/${{ vars.ECR_REPOSITORY }}:${{ inputs.sha }}
            ${{ env.GHCR_IMAGE }}:sha-${{ inputs.sha }}
            ${{ inputs.push-latest && format('{0}:latest', env.GHCR_IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            git_token=${{ secrets.GITHUB_TOKEN }}

      - name: Retag existing image as latest
        if: steps.existing.outputs.exists == 'true' && inputs.push-latest
        run: |
          docker buildx imagetools create \
            --tag "${{ env.GHCR_IMAGE }}:latest" \
            --tag "${{ env.GHCR_IMAGE }}:sha-${{ inputs.sha }}" \
            "${{ steps.ecr.outputs.image_registry }}/${{ vars.ECR_REPOSITORY }}:${{ inputs.sha }}"
