name: Snyk OAuth Authentication
description: Fetches a Snyk OAuth Token

runs:
  using: composite
  steps:
    - name: Fetch Snyk OAuth Token
      shell: bash
      run: |
        set -euo pipefail

        TOKEN=$(curl -sS --fail-with-body -X POST "https://api.snyk.io/oauth2/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=client_credentials" \
          -d "client_id=$SNYK_CLIENT_ID" \
          -d "client_secret=$SNYK_CLIENT_SECRET" \
          | jq -r '.access_token')

        if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "::error::Snyk token exchange returned no access_token"
          exit 1
        fi

        echo "::add-mask::$TOKEN"
        echo "SNYK_OAUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
