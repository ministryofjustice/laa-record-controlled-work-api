name: Set up Java and Gradle
description: Installs the project JDK and configures Gradle with dependency caching

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: 25
        distribution: corretto

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
