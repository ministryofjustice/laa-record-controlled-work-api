services:
  rcw-api:
    container_name: rcw-api
    build:
      context: .
      secrets:
        - git_token
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
      - "8181:8181"
      - "5005:5005"
    depends_on:
      - mock-oauth2-server
      - datastore-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Resource-server validation of the incoming token (RCW API's own audience).
      # Defaults to the mock OAuth2 server; set ISSUER/AUDIENCE in .env to switch to Entra (see .env.example).
      - ISSUER=${ISSUER:-http://host.docker.internal:9090/default}
      - AUDIENCE=${AUDIENCE:-default}
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=local
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_SERVER_RESOURCE=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_JWT=DEBUG
      # preferIPv4Stack avoids musl's parallel A/AAAA DNS lookups, which can hang/fail for
      # public hosts (e.g. login.microsoftonline.com) on networks that drop IPv6 DNS queries.
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Djava.net.preferIPv4Stack=true
      - DATASTORE_URL=http://datastore-api:8080
      # RCW -> datastore jwt-bearer (OBO) exchange. Defaults to the mock OAuth2 server;
      # set these in .env to switch to a real Entra app registration (see .env.example).
      - DATASTORE_TOKEN_URI=${DATASTORE_TOKEN_URI:-http://host.docker.internal:9090/default/token}
      - RCW_API_CLIENT_ID=${RCW_API_CLIENT_ID:-rcw-api}
      - RCW_API_CLIENT_SECRET=${RCW_API_CLIENT_SECRET:-not-used-by-mock-oauth2-server}

  datastore-api:
    container_name: datastore-api
    build:
      context: ../laa-info-and-advice-datastore
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mock-oauth2-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/laa_info_advice_datastore
      - DB_USERNAME=laa_user
      - DB_PASSWORD=laa_password
      # Resource-server validation of the exchanged token (datastore's own audience).
      # Defaults to the mock OAuth2 server; set these in .env to switch to Entra (see .env.example).
      - LAA_OAUTH2_ISSUER_URI=${DATASTORE_ENTRA_ISSUER_URI:-http://host.docker.internal:9090/default}
      - LAA_OAUTH2_AUDIENCE=${DATASTORE_ENTRA_AUDIENCE:-default}
      # preferIPv4Stack avoids musl's parallel A/AAAA DNS lookups, which can hang/fail for
      # public hosts (e.g. login.microsoftonline.com) on networks that drop IPv6 DNS queries.
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true

  postgres:
    image: postgres:18
    container_name: laa-info-and-advice-datastore
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laa_info_advice_datastore
      POSTGRES_USER: laa_user
      POSTGRES_PASSWORD: laa_password
    volumes:
      - /var/lib/postgresql/18/docker

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: mock-oauth2-server
    ports:
      - "9090:9090"
    environment:
      - SERVER_PORT=9090
      - JSON_CONFIG_PATH=/etc/mock-oauth2-config.json
    volumes:
      - ./mock-oauth2-config.json:/etc/mock-oauth2-config.json
      - ./mock-oauth2-login.html:/etc/mock-oauth2-login.html

secrets:
  git_token:
    environment: GITHUB_TOKEN
