# Composed from the reusable building blocks under docker/compose/, plus the datastore's own
# building blocks (sibling checkout required), so other repos (e.g. laa-record-controlled-work)
# can include the same files individually.
include:
  - docker/compose/include.api.yml
  - docker/compose/include.mock-oauth.yml
  - ../laa-info-and-advice-datastore/docker/compose/include.api.yml
  - ../laa-info-and-advice-datastore/docker/compose/include.postgres.yml
