name: local-https
variables:
  - name: baseUrl
    value: http://localhost:8081
  - name: applicationId
    value: ""
    description: Application UUID used by application-specific requests
  - name: officeId
    value: ""
    description: Office UUID used to filter the applications list
  - name: applicationStatus
    value: DRAFT
    description: Application status filter for applications list (DRAFT or COMPLETED)
  - name: eligibilityIndication
    value: ELIGIBLE
    description: Eligibility filter for applications list (ELIGIBLE or INELIGIBLE)
  - name: oauthAuthorizeUrl
    value: https://host.docker.internal:9090/default/authorize
  - name: oauthTokenUrl
    value: https://host.docker.internal:9090/default/token
  - name: oauthClientId
    value: local-dev-client
  - name: oauthClientSecret
    value: local-dev-secret
  - name: oauthScope
    value: openid default