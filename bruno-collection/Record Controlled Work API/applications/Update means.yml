info:
  name: Update means
  type: http
  seq: 4
  tags:
    - applications

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/applications/{{$randomUUID}}/means"
  body:
    type: json
    data: |-
      {
        "data": {},
        "result": {}
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should be 204 response", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

