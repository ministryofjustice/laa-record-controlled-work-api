info:
  name: Get application
  type: http
  seq: 2
  tags:
    - applications

http:
  method: GET
  url: "{{baseUrl}}/api/v1/applications/{{applicationId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.deleteVar("detailsETag");
        bru.deleteVar("detailsETagApplicationId");
    - type: after-response
      code: |-
        const selectedApplicationId = bru.getVar("applicationId");
        const etag = res.getHeader("ETag");

        if (res.getStatus() === 200 && selectedApplicationId && /^"\d+"$/.test(etag || "")) {
          bru.setVar("detailsETag", etag);
          bru.setVar("detailsETagApplicationId", selectedApplicationId);
        }
    - type: tests
      code: |-
        test("should be 200 response", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should capture the selected application's strong ETag", function () {
          expect(bru.getVar("detailsETag")).to.match(/^"\d+"$/);
          expect(bru.getVar("detailsETagApplicationId")).to.equal(bru.getVar("applicationId"));
        });

        test("should return an application object", function () {
          const application = res.getBody();
          expect(application).to.be.an("object");
          expect(application).not.to.be.an("array");
        });

        test("should include the required application fields", function () {
          const application = res.getBody();
          [
            "id",
            "individualLegalAidNumber",
            "providerFirmCode",
            "providerOfficeCode",
            "clientDetails",
            "applicationState",
            "declaration",
            "evidence",
            "eligibilityAssessment",
            "scopingQuestions",
            "applicationType",
            "ecfFlag",
            "createdAt",
            "createdBy",
            "modifiedAt",
            "modifiedBy"
          ].forEach(property => expect(application).to.have.property(property));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v1/applications/{{applicationId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: ETag
          value: '"1"'
      body:
        type: json
        data: |-
          {
            "id": "11111111-2222-4333-8444-555555555555",
            "individualLegalAidNumber": "22222222-3333-4444-8555-666666666666",
            "providerFirmCode": "123456",
            "providerOfficeCode": "AB12CD",
            "clientDetails": {
              "id": "33333333-4444-4555-8666-777777777777",
              "firstName": "Synthetic",
              "lastName": "Client",
              "dateOfBirth": "1990-01-01",
              "hasFixedAddress": false,
              "address": null,
              "createdAt": "2026-01-01T12:00:00Z",
              "modifiedAt": "2026-01-01T12:00:00Z"
            },
            "applicationState": "DRAFT",
            "declaration": null,
            "evidence": {
              "evidenceExemptionCode": null,
              "evidenceExemptionReason": null,
              "incomeEvidenceChecklist": null,
              "expenditureCapitalEvidenceChecklist": null
            },
            "eligibilityAssessment": {
              "data": null,
              "result": null
            },
            "scopingQuestions": {
              "priorLegalAid": "yesSameMatter",
              "familyLawClassification": "private",
              "needsAdviceOnEUOrInternationalMaintenance": false,
              "needsProtectiveInjunction": false,
              "laspoEvidenceScope": "domesticAbuse",
              "caseMeetsMeritsCriteria": true
            },
            "applicationType": "RCW",
            "ecfFlag": false,
            "createdAt": "2026-01-01T12:00:00Z",
            "createdBy": "synthetic-user",
            "modifiedAt": "2026-01-01T12:00:00Z",
            "modifiedBy": "synthetic-user"
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/applications/{{applicationId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/applications/{{applicationId}}"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/v1/applications/{{applicationId}}"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
