info:
  name: Create applications
  type: http
  seq: 3
  tags:
    - applications

http:
  method: POST
  url: "{{baseUrl}}/api/v1/applications"
  body:
    type: json
    data: |-
      {
        "ecfFlag": false,
        "legalAidBefore": "false",
        "providerOfficeCode": "22439e72-68d3-4770-b435-c352d883d21e",
        "clientDetails": {
          "firstName": "Joe",
          "lastName": "Bloggs",
          "dateOfBirth": "1990-01-01",
          "niNumber": "QQ123456C",
          "hasFixedAddress": true,
          "address": {
            "addressLine1": "10 Downing Street",
            "addressLine2": "Prime ministers address",
            "postCode": "SW1A 2AA",
            "townOrCity": "London",
            "country": "GB"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should be 201 response", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("should include Location header", function () {
          const location = res.getHeader("Location");
          expect(location).to.be.a("string");
          expect(location).to.match(/\/api\/v1\/applications\/[0-9a-fA-F-]{36}$/);
        });

        test("should return empty response body", function () {
          expect(res.getBody()).to.equal("");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
      body:
        type: json
        data: |-
          {
            "ecfFlag": false,
            "legalAidBefore": "false",
            "providerOfficeCode": "22439e72-68d3-4770-b435-c352d883d21e",
            "clientDetails": {
              "firstName": "Joe",
              "lastName": "Bloggs",
              "dateOfBirth": "1990-01-01",
              "niNumber": "QQ123456C",
              "hasFixedAddress": true,
              "address": {
                "addressLine1": "10 Downing Street",
                "addressLine2": "Prime ministers address",
                "postCode": "SW1A 2AA",
                "townOrCity": "London",
                "country": "GB"
              }
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Location
          value: "{{baseUrl}}/api/v1/applications/b2c3d4e5-f6a7-8901-bcde-f12345678901"
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
