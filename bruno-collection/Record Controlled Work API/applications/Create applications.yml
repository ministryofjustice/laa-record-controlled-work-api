info:
  name: Create applications
  type: http
  seq: 3
  tags:
    - applications

http:
  method: POST
  url: "{{baseUrl}}/api/v1/applications"
  body:
    type: json
    data: |-
      {
        "providerOfficeCode": "{{providerOfficeCode}}",
        "legalAidLast6Months": false,
        "reasonForReapplication": "",
        "ecfFlag": false,
        "scopingQuestions": {
          "priorLegalAid": "yesSameMatter",
          "familyLawClassification": "private",
          "needsAdviceOnEUOrInternationalMaintenance": false,
          "needsProtectiveInjunction": false,
          "laspoEvidenceScope": "domesticAbuse",
          "caseMeetsMeritsCriteria": true
        },
        "clientDetails": {
          "firstName": "Synthetic",
          "lastName": "PenTest",
          "dateOfBirth": "1990-01-01",
          "hasFixedAddress": false
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const applicationId = res.getBody()?.id;

          if (typeof applicationId === "string" && /^[0-9a-fA-F-]{36}$/.test(applicationId)) {
            bru.setVar("createdApplicationId", applicationId);
          }
        }
    - type: tests
      code: |-
        test("should be 201 response", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("should include Location header", function () {
          const location = res.getHeader("Location");
          expect(location).to.be.a("string");
          expect(location).to.match(/\/api\/v1\/applications\/[0-9a-fA-F-]{36}$/);
        });

        test("should return the created application ID", function () {
          expect(res.getBody().id).to.match(/^[0-9a-fA-F-]{36}$/);
        });

        test("Location should identify the created application", function () {
          expect(res.getHeader("Location")).to.match(
            new RegExp("/api/v1/applications/" + res.getBody().id + "$")
          );
        });

        test("should store the created application ID", function () {
          expect(bru.getVar("createdApplicationId")).to.equal(res.getBody().id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
      body:
        type: json
        data: |-
          {
            "providerOfficeCode": "{{providerOfficeCode}}",
            "legalAidLast6Months": false,
            "reasonForReapplication": "",
            "ecfFlag": false,
            "scopingQuestions": {
              "priorLegalAid": "yesSameMatter",
              "familyLawClassification": "private",
              "needsAdviceOnEUOrInternationalMaintenance": false,
              "needsProtectiveInjunction": false,
              "laspoEvidenceScope": "domesticAbuse",
              "caseMeetsMeritsCriteria": true
            },
            "clientDetails": {
              "firstName": "Synthetic",
              "lastName": "PenTest",
              "dateOfBirth": "1990-01-01",
              "hasFixedAddress": false
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Location
          value: "{{baseUrl}}/api/v1/applications/11111111-2222-4333-8444-555555555555"
      body:
        type: json
        data: |-
          {
            "id": "11111111-2222-4333-8444-555555555555"
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/v1/applications"
      method: POST
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
