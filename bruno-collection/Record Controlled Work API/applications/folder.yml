info:
  name: applications
  type: folder
  seq: 1

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oauthAuthorizeUrl}}"
    accessTokenUrl: "{{oauthTokenUrl}}"
    callbackUrl: "https://oauth.usebruno.com/callback"
    credentials:
      clientId: "{{oauthClientId}}"
      clientSecret: "{{oauthClientSecret}}"
    scope: "{{oauthScope}}"
    pkce: {}
    tokenConfig:
      id: applications-token
      placement:
        header: Bearer
    settings:
      autoFetchToken: true
      autoRefreshToken: true

runtime:
  scripts:
    - type: before-request
      code: |-
        const suppliedApplicationId = bru.getEnvVar("applicationId");
        const createdApplicationId = bru.getVar("createdApplicationId");

        if (suppliedApplicationId || createdApplicationId) {
          bru.setVar("applicationId", suppliedApplicationId || createdApplicationId);
        } else {
          bru.deleteVar("applicationId");
        }
