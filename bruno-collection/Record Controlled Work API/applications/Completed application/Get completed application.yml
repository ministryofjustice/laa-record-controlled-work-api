info:
  name: Get completed application
  type: http
  seq: 6
  tags:
    - applications

http:
  method: GET
  url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const applicationId = bru.getVar("completedApplicationId");

        if (
          !applicationId ||
          bru.getVar("completedApplicationStatusUpdatedId") !== applicationId
        ) {
          throw new Error("Complete the prepared fixture before checking its completed state.");
        }
        bru.deleteVar("completedApplicationETag");
        bru.deleteVar("completedApplicationETagApplicationId");
    - type: after-response
      code: |-
        const applicationId = bru.getVar("completedApplicationId");
        const etag = res.getHeader("ETag");

        if (
          res.getStatus() === 200 &&
          res.getBody()?.applicationState === "COMPLETED" &&
          /^"\d+"$/.test(etag || "")
        ) {
          bru.setVar("completedApplicationETag", etag);
          bru.setVar("completedApplicationETagApplicationId", applicationId);
        }
    - type: tests
      code: |-
        test("should confirm the fixture is completed", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().applicationState).to.equal("COMPLETED");
        });

        test("should capture the completed application's strong ETag", function () {
          expect(bru.getVar("completedApplicationETag")).to.match(/^"\d+"$/);
          expect(bru.getVar("completedApplicationETagApplicationId"))
            .to.equal(bru.getVar("completedApplicationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Completed synthetic application with its current strong ETag
