info:
  name: Update means
  type: http
  seq: 2
  tags:
    - applications

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/means"
  body:
    type: json
    data: |-
      {
        "data": {
          "level_of_help": "controlled",
          "adult_dependants": false
        },
        "result": {}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("completedApplicationId")) {
          throw new Error("Create the completed application fixture before updating its means.");
        }
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setVar("completedMeansApplicationId", bru.getVar("completedApplicationId"));
        }
    - type: tests
      code: |-
        test("should update means data", function () {
          expect(res.getStatus()).to.equal(204);
          expect(bru.getVar("completedMeansApplicationId"))
            .to.equal(bru.getVar("completedApplicationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Synthetic means data saved without calculating eligibility
    request:
      url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/means"
      method: PUT
      body:
        type: json
        data: |-
          {
            "data": {
              "level_of_help": "controlled",
              "adult_dependants": false
            },
            "result": {}
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
