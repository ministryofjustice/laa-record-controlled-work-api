info:
  name: Update declaration
  type: http
  seq: 4
  tags:
    - applications

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/declaration"
  body:
    type: json
    data: |-
      {
        "ufn": "123456/001",
        "declarationConfirmation": true,
        "dateSigned": "2026-01-15"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("completedApplicationId")) {
          throw new Error("Create the completed application fixture before updating its declaration.");
        }
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setVar("completedDeclarationApplicationId", bru.getVar("completedApplicationId"));
        }
    - type: tests
      code: |-
        test("should update the signed declaration", function () {
          expect(res.getStatus()).to.equal(204);
          expect(bru.getVar("completedDeclarationApplicationId"))
            .to.equal(bru.getVar("completedApplicationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Synthetic signed declaration saved
    request:
      url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/declaration"
      method: PUT
      body:
        type: json
        data: |-
          {
            "ufn": "123456/001",
            "declarationConfirmation": true,
            "dateSigned": "2026-01-15"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
