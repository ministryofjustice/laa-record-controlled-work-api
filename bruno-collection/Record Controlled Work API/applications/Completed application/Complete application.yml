info:
  name: Complete application
  description: Completes only the separate fixture after its means, evidence, and declaration updates.
  type: http
  seq: 5
  tags:
    - applications

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/status"
  body:
    type: json
    data: |-
      {
        "applicationState": "COMPLETED",
        "eTag": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: before-request
      code: |-
        const applicationId = bru.getVar("completedApplicationId");

        if (!applicationId) {
          throw new Error("Create the completed application fixture before completing it.");
        }

        const requiredUpdates = [
          bru.getVar("completedMeansApplicationId"),
          bru.getVar("completedEvidenceApplicationId"),
          bru.getVar("completedDeclarationApplicationId")
        ];

        if (requiredUpdates.some(updatedApplicationId => updatedApplicationId !== applicationId)) {
          throw new Error(
            "Update means, evidence, and declaration for this fixture before completing it."
          );
        }
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setVar("completedApplicationStatusUpdatedId", bru.getVar("completedApplicationId"));
        }
    - type: tests
      code: |-
        test("should complete the prepared synthetic application", function () {
          expect(res.getStatus()).to.equal(204);
          expect(bru.getVar("completedApplicationStatusUpdatedId"))
            .to.equal(bru.getVar("completedApplicationId"));
        });

examples:
