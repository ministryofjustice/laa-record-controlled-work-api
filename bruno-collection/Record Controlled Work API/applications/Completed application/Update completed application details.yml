info:
  name: Try update completed application details
  description: Requires the completed fixture and a fresh retrieval. Expected response is 409 APPLICATION_COMPLETED.
  type: http
  seq: 7
  tags:
    - applications

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/details"
  headers:
    - name: If-Match
      value: "{{completedApplicationETag}}"
  body:
    type: json
    data: |-
      {
        "scopingQuestions": {
          "priorLegalAid": "yesSameMatter",
          "familyLawClassification": "private",
          "needsAdviceOnEUOrInternationalMaintenance": false,
          "needsProtectiveInjunction": false,
          "laspoEvidenceScope": "domesticAbuse",
          "caseMeetsMeritsCriteria": true
        },
        "legalAidLast6Months": false,
        "reasonForReapplication": null,
        "ecfFlag": false,
        "clientDetails": {
          "firstName": "Synthetic",
          "lastName": "Client",
          "dateOfBirth": "1990-01-01",
          "niNumber": null,
          "hasFixedAddress": false,
          "address": null
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const applicationId = bru.getVar("completedApplicationId");
        const etagApplicationId = bru.getVar("completedApplicationETagApplicationId");
        const etag = bru.getVar("completedApplicationETag");

        if (bru.getVar("completedApplicationStatusUpdatedId") !== applicationId) {
          throw new Error("Complete the prepared fixture before attempting a details update.");
        }

        if (etagApplicationId !== applicationId || !/^"\d+"$/.test(etag || "")) {
          throw new Error("Retrieve the completed application before attempting a details update.");
        }
    - type: after-response
      code: |-
        bru.deleteVar("completedApplicationETag");
        bru.deleteVar("completedApplicationETagApplicationId");
    - type: tests
      code: |-
        test("should reject a details update to the completed application", function () {
          expect(res.getStatus()).to.equal(409);
          expect(res.getBody().reason).to.equal("APPLICATION_COMPLETED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 409 Response
    description: Completed applications reject details updates
    request:
      url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/details"
      method: PUT
      headers:
        - name: If-Match
          value: '"5"'
      body:
        type: json
        data: |-
          {
            "scopingQuestions": {
              "priorLegalAid": "yesSameMatter",
              "familyLawClassification": "private",
              "needsAdviceOnEUOrInternationalMaintenance": false,
              "needsProtectiveInjunction": false,
              "laspoEvidenceScope": "domesticAbuse",
              "caseMeetsMeritsCriteria": true
            },
            "legalAidLast6Months": false,
            "reasonForReapplication": null,
            "ecfFlag": false,
            "clientDetails": {
              "firstName": "Synthetic",
              "lastName": "Client",
              "dateOfBirth": "1990-01-01",
              "niNumber": null,
              "hasFixedAddress": false,
              "address": null
            }
          }
    response:
      status: 409
      statusText: Conflict
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Conflict",
            "status": 409,
            "detail": "Application 11111111-2222-4333-8444-555555555555 has already been completed",
            "instance": "/api/v1/applications/11111111-2222-4333-8444-555555555555/details",
            "reason": "APPLICATION_COMPLETED"
          }
