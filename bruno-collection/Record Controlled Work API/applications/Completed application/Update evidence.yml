info:
  name: Update evidence
  type: http
  seq: 3
  tags:
    - applications

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/evidence"
  body:
    type: json
    data: |-
      {
        "evidenceExemptionCode": "adviceOverPhone",
        "evidenceExemptionReason": "Synthetic client was advised over the phone",
        "incomeEvidenceChecklist": {
          "payslips": true
        },
        "expenditureCapitalEvidenceChecklist": {
          "bankStatements": true
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("completedApplicationId")) {
          throw new Error("Create the completed application fixture before updating its evidence.");
        }
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setVar("completedEvidenceApplicationId", bru.getVar("completedApplicationId"));
        }
    - type: tests
      code: |-
        test("should update evidence data", function () {
          expect(res.getStatus()).to.equal(204);
          expect(bru.getVar("completedEvidenceApplicationId"))
            .to.equal(bru.getVar("completedApplicationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Synthetic evidence data saved
    request:
      url: "{{baseUrl}}/api/v1/applications/{{completedApplicationId}}/evidence"
      method: PUT
      body:
        type: json
        data: |-
          {
            "evidenceExemptionCode": "adviceOverPhone",
            "evidenceExemptionReason": "Synthetic client was advised over the phone",
            "incomeEvidenceChecklist": {
              "payslips": true
            },
            "expenditureCapitalEvidenceChecklist": {
              "bankStatements": true
            }
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
